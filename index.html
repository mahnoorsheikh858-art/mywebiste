<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library Catalog</title>
<style>
  :root { --bg:#f6f7f9; --ink:#1b2430; --muted:#5d6b7a; --line:#d9dee5; --accent:#1f6f5c; --warn:#a4452c; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Georgia, 'Times New Roman', serif; background:var(--bg); color:var(--ink); }
  main { max-width: 760px; margin: 0 auto; padding: 2rem 1rem 4rem; }
  h1 { font-size: 2rem; margin: 0 0 .25rem; }
  p.sub { color: var(--muted); margin: 0 0 1.5rem; font-family: system-ui, sans-serif; }
  .bar { display:flex; gap:.5rem; margin-bottom:1rem; flex-wrap:wrap; }
  input, select, button { font: inherit; font-family: system-ui, sans-serif; padding:.55rem .7rem; border:1px solid var(--line); border-radius:6px; background:#fff; }
  input { flex:1; min-width:180px; }
  button { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); }
  th, td { text-align:left; padding:.7rem .8rem; border-bottom:1px solid var(--line); font-family: system-ui, sans-serif; }
  th { background:#eef1f4; font-weight:600; }
  .yes { color:var(--accent); } .no { color:var(--warn); }
  #status { margin-top:1rem; color:var(--muted); font-family: system-ui, sans-serif; }
  .table-wrap { overflow-x:auto; }
</style>
</head>
<body>
<main>
  <h1>Library Catalog</h1>
  <p class="sub">Frontend in HTML, data in SQL, queries run live in your browser.</p>

  <div class="bar">
    <input id="search" type="search" placeholder="Search title or author" aria-label="Search books">
    <select id="filter" aria-label="Filter by availability">
      <option value="all">All books</option>
      <option value="1">Available</option>
      <option value="0">Checked out</option>
    </select>
    <button id="go">Search</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead><tr><th>Title</th><th>Author</th><th>Year</th><th>Status</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p id="status">Loading database…</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script>
let db;

async function init() {
  const SQL = await initSqlJs({
    locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}`
  });
  db = new SQL.Database();
  const sql = await (await fetch('data.sql')).text();   // data.sql sits next to index.html
  db.run(sql);
  render();
}

// "Backend" logic: a parameterized SQL query
function render() {
  const q = document.getElementById('search').value.trim();
  const f = document.getElementById('filter').value;
  let query = 'SELECT title, author, year, available FROM books WHERE (title LIKE ? OR author LIKE ?)';
  const params = [`%${q}%`, `%${q}%`];
  if (f !== 'all') { query += ' AND available = ?'; params.push(Number(f)); }
  query += ' ORDER BY title';

  const res = db.exec(query, params);
  const rows = res.length ? res[0].values : [];
  const tbody = document.getElementById('rows');
  tbody.innerHTML = '';
  rows.forEach(([title, author, year, avail]) => {
    const tr = document.createElement('tr');
    [title, author, year].forEach(v => { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); });
    const st = document.createElement('td');
    st.textContent = avail ? 'Available' : 'Checked out';
    st.className = avail ? 'yes' : 'no';
    tr.appendChild(st);
    tbody.appendChild(tr);
  });
  document.getElementById('status').textContent = `${rows.length} book(s) found`;
}

document.getElementById('go').addEventListener('click', render);
document.getElementById('search').addEventListener('input', render);
document.getElementById('filter').addEventListener('change', render);
init().catch(e => document.getElementById('status').textContent = 'Failed to load: ' + e.message);
</script>
</body>
</html>
